# Documentation-only configuration; equivalent CLI flags are shown in README.
dataset: cifar100lt
imbalance_factor: 100
validation_fraction: 0.1
seed: 42
backbone: resnet18
image_size: 224
epochs: 50
optimizer: AdamW
learning_rate: 0.0001
weight_decay: 0.0001
batch_size: 16
scheduler: cosine
rafa_rank: 16
router_temperature: 1.0
auxiliary_router_loss_weight: 0.1
gate_bias_init: -2.0
gate_raw_slope_init: 1.85
shot_grouping: threshold
