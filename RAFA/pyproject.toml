[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "rafa-longtail"
version = "0.1.0"
description = "RAFA: Lightweight Plug-and-Play Rarity-Aware Feature Adapter for Long-Tailed Recognition"
requires-python = ">=3.10"
dependencies = [
  "torch>=2.1",
  "torchvision>=0.16",
  "numpy>=1.24",
  "Pillow>=9.0",
  "scipy>=1.10"
]

[project.optional-dependencies]
test = ["pytest>=7.0"]

[tool.setuptools.packages.find]
include = ["rafa*"]
